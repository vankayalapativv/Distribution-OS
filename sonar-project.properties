# SonarQube Cloud (sonarcloud.io) — whole-monorepo analysis.
# Token is NOT stored here; it is passed at run time via the SONAR_TOKEN env var.
sonar.host.url=https://sonarcloud.io
sonar.organization=vankayalapativv
sonar.projectKey=vankayalapativv_Sri-Aparajita-Distribution-OS
sonar.projectName=Sri Aparajita Distribution OS

# Analyse all app + package source, let the scanner auto-detect TS/JS.
sonar.sources=apps,packages
sonar.sourceEncoding=UTF-8

# Keep generated / vendored / build output out of the analysis.
sonar.exclusions=**/node_modules/**,**/.next/**,**/.open-next/**,**/.turbo/**,**/dist/**,**/build/**,**/.wrangler/**,**/coverage/**,**/*.min.js,**/*.d.ts,**/public/**,packages/db/migrations/**,**/map/telangana-boundary.ts

# Treat *.test.ts / *.spec.ts as tests (not duplicated as main source).
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage (Phase 5) — vitest lcov from each test package, generated by
# `pnpm test:coverage`. Paths are read from the coverage/ dirs even though
# those dirs are excluded from source analysis above.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,apps/mobile/coverage/lcov.info,apps/mcp/coverage/lcov.info
